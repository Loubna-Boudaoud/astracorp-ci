
name: Tableau de bord

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer ruff
        run: pip install ruff==0.16.8

      - name: Analyser le code
        run: ruff check .

      - name: Vérifier les calculs
        run: python verifier.py

      - name: Afficher le message secret
        env:
          MESSAGE: ${{ secrets.MESSAGE }}
        run: 'echo "$MESSAGE"'
  
  publier:
    needs: qualite
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Générer le rapport
        run: python diagnostic.py . public

      - name: Déposer le site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v5
